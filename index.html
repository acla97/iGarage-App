<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>iGarage</title>
<meta name="description" content="iGarage: manutenzione, scadenze e spese di auto e scooter">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<script>(function(){try{var p=localStorage.getItem("garage-theme")||"auto";var d=p==="dark"||(p==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-skin",d?"dark":"light")}catch(e){document.documentElement.setAttribute("data-skin","dark")}})()</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iGarage">
<meta name="format-detection" content="telephone=no">
<style>
/* Garage – stile iOS scuro, minimal */
:root{
  color-scheme:dark;
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--yellow:#ffd60a;--indigo:#5e5ce6;--teal:#64d2ff;
  --gt:#30d158;--ot:#ff9f0a;--rt:#ff453a;
  --bar:rgba(28,28,30,.8);--sheet:#1c1c1e;--sheetg:#2c2c2e;--sheetp:#3a3a3c;--asbox:rgba(44,44,46,.97);--toast:rgba(58,58,60,.96);
  --xbg:#000;--xbd:#636366;--segon:#636366;--backdrop:rgba(0,0,0,.45);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
:root[data-skin=light]{
  color-scheme:light;
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e9e9ee;--bg4:#d1d1d6;
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.22);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--yellow:#ffcc00;--indigo:#5856d6;--teal:#32ade6;
  --gt:#1e8e3e;--ot:#b25e00;--rt:#d70015;
  --bar:rgba(249,249,249,.86);--sheet:#f2f2f7;--sheetg:#fff;--sheetp:#e5e5ea;--asbox:rgba(255,255,255,.96);--toast:rgba(40,40,42,.92);
  --xbg:#fff;--xbd:#c7c7cc;--segon:#fff;--backdrop:rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);
  font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{position:fixed;inset:0;overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}

/* barra in alto */
.nav{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(44px + var(--sat));padding:var(--sat) 16px 0;
  display:flex;align-items:center;justify-content:space-between;transition:background .2s,box-shadow .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav .small{position:absolute;left:70px;right:70px;bottom:0;height:44px;line-height:44px;text-align:center;font-weight:600;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.solid .small{opacity:1}
.nav .slot{min-width:44px;display:flex;align-items:center;position:relative;z-index:1}
.nav .slot.r{justify-content:flex-end}
.nav .lnk{color:var(--blue);font-size:17px;padding:10px 0}
.nav svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}

#screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 44px) 16px calc(92px + var(--sab))}
h1.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.37px;margin:6px 0 18px}

/* barra delle schede */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;padding:7px 6px calc(7px + var(--sab));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8e8e93;position:relative}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}
.tab .dot{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* gruppi e righe */
.group-title{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;color:var(--label2);margin:24px 16px 7px;letter-spacing:-.08px}
.group-title.first{margin-top:0}
.group-foot{font-size:13px;color:var(--label2);margin:8px 16px 0}
.group{background:var(--bg2);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;position:relative;gap:12px;width:100%;text-align:left}
.row.two{padding-top:9px;padding-bottom:9px;min-height:56px}
.row+.row::before,.frow+.frow::before,.group>.thumbs:not(:empty)+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.icon+.row::before{left:58px}
.tap:active{background:var(--bg3)}
.row .t{flex:1;min-width:0}
.row .a{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{font-size:13px;color:var(--label2);margin-top:1px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.row .v{color:var(--label2);flex:none}
.row.red,.row.red .a{color:var(--red)}
.row.blue,.row.blue .a{color:var(--blue)}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:17px;flex:none}
.chev{width:8px;height:14px;flex:none;stroke:var(--label3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{flex:none;font-size:14px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(48,209,88,.16);color:var(--gt)}
.badge.l1{background:rgba(255,159,10,.18);color:var(--ot)}
.badge.l2{background:rgba(255,69,58,.18);color:var(--rt)}
.badge.l-1{background:rgba(142,142,147,.2);color:#aeaeb2}
.amount{flex:none;font-weight:500}

/* scheda auto */
.hero{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--blue) 0%,#5e5ce6 100%);box-shadow:0 10px 30px rgba(10,132,255,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hero .cn{font-size:22px;font-weight:700;margin-top:10px;letter-spacing:.2px}
.hero .cs{font-size:14px;opacity:.85;margin-top:2px}
.hero .avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.2);flex:none}
.hero .kmrow{display:flex;align-items:baseline;gap:6px;margin-top:18px;position:relative;z-index:1}
.hero .kmn{font-size:42px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .kmu{font-size:17px;opacity:.85}
.hero .kms{font-size:13px;opacity:.85;position:relative;z-index:1}
.hero .hbtn{margin-top:14px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.22);font-weight:600;font-size:15px;position:relative;z-index:1}
.hero .hbtn:active{background:rgba(255,255,255,.35)}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border-radius:6px;overflow:hidden;border:1.5px solid #1b1b1b;font-weight:700}
.plate i{background:#0b3d9b;color:#ffd60a;font-style:normal;font-size:10px;width:18px;display:grid;place-items:center}
.plate b{padding:3px 10px;font-size:19px;letter-spacing:2px;font-family:ui-monospace,"SF Mono",Menlo,monospace}

.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;text-align:center}
.btn:active{opacity:.8}
.btn.gray{background:var(--bg2);color:var(--blue)}
.btn.gray:active{background:var(--bg3)}
.btn.sp{margin-top:14px}

.status{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:14px 16px;margin-top:12px;width:100%;text-align:left}
.status .si{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
.status.ok .si{background:rgba(48,209,88,.18);color:var(--gt)}
.status.l1 .si{background:rgba(255,159,10,.2);color:var(--ot)}
.status.l2 .si{background:rgba(255,69,58,.2);color:var(--rt)}
.status.l0 .si{background:rgba(142,142,147,.2);color:#aeaeb2}
.status .a{font-weight:600}
.status .b{font-size:13px;color:var(--label2)}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15px}
.banner .bi{font-size:22px;line-height:1}
.banner b{display:block;margin-bottom:2px}
.banner .x{margin-left:auto;color:var(--label3);font-size:18px;padding:0 0 0 8px}
.banner .lk{color:var(--blue);font-weight:600;margin-top:6px;display:inline-block}

/* filtri */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--bg2);font-size:15px;color:var(--label2);font-weight:500}
.chip.on{background:var(--blue);color:#fff}

/* statistiche */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border-radius:14px;padding:14px}
.stat .n{font-size:24px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--label2);margin-top:2px}
.bars{padding:6px 16px 14px}
.brow{padding:9px 0 0}
.brow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.brow .top>span:first-child{display:flex;align-items:center;gap:8px}
.brow .top>span:last-child{white-space:nowrap;flex:none}
.bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.muted{color:var(--label2)}

.empty{text-align:center;color:var(--label2);padding:44px 28px}
.empty .big{font-size:56px;margin-bottom:8px}
.empty h2{color:var(--label);font-size:20px;margin:0 0 6px}
.empty p{margin:0 0 18px;font-size:15px}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.welcome .logo{width:96px;height:96px;border-radius:22px;margin:0 auto 18px;display:block;box-shadow:0 10px 30px rgba(10,132,255,.3)}
.welcome h1{font-size:34px;text-align:center;margin:0 0 8px}
.welcome p{color:var(--label2);text-align:center;margin:0 0 24px}
.feat{display:flex;gap:14px;align-items:center;margin:0 4px 16px}
.feat .ico{width:42px;height:42px;border-radius:10px;font-size:22px}
.feat b{display:block}.feat span{font-size:14px;color:var(--label2)}
.linkbtn{display:block;margin:16px auto 0;color:var(--blue);font-size:15px}

/* schede a comparsa (form) */
#overlay{position:absolute;inset:0;z-index:20;pointer-events:none}
#overlay.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .28s}
.open>.backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px);background:var(--sheet);border-radius:14px 14px 0 0;
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;overflow:hidden}
.open>.sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;flex:none;position:relative}
.sheet-head .ttl{font-weight:600;position:absolute;left:90px;right:90px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .lnk{color:var(--blue);font-size:17px;padding:10px 0;position:relative;z-index:1}
.sheet-head .lnk.b{font-weight:600}
.sheet-body{overflow-y:auto;flex:1;padding:0 16px calc(32px + var(--sab));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .group{background:var(--sheetg)}
.sheet .tap:active{background:var(--sheetp)}
.sheet .group-title:first-child{margin-top:4px}
.frow{display:flex;align-items:center;min-height:46px;padding:0 16px;position:relative;gap:12px}
.frow>span{flex:none}
.frow input,.frow select,.frow textarea{flex:1;min-width:0;background:none;border:0;color:var(--label);font:inherit;text-align:right;outline:none;
  padding:12px 0;-webkit-appearance:none;appearance:none;border-radius:0}
.frow select{text-align-last:right;color:var(--label)}
.frow input::placeholder,.frow textarea::placeholder{color:var(--label3)}
.frow input[type=date]{min-height:34px;padding:6px 0;text-align:right}
.frow.col{display:block;padding:0 16px}
.frow.col textarea{width:100%;text-align:left;resize:none;display:block;padding:12px 0}
.sheet .btn{margin-top:18px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px 4px}
.thumbs:empty{display:none}
.thumb{position:relative;width:76px;height:76px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:var(--bg3);display:block}
.thumb .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--xbg);border:1.5px solid var(--xbd);color:var(--label);font-size:12px;display:grid;place-items:center}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--bg3)}

/* action sheet */
#as{position:absolute;inset:0;z-index:30;pointer-events:none}
#as.open{pointer-events:auto}
.as{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sab));transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
#as.open .as{transform:none}
.as .box{background:var(--asbox);border-radius:14px;overflow:hidden;margin-top:8px}
.as .box>div,.as .box>button{display:block;width:100%;padding:17px 16px;font-size:20px;text-align:center;color:var(--blue)}
.as .box>button+button,.as .box>div+button{border-top:.5px solid var(--sep)}
.as .as-t{font-size:13px;color:var(--label2);padding:14px 16px;border-bottom:.5px solid var(--sep)}
.as .box>button:active{background:var(--sheetp)}
.as .danger{color:var(--red)}
.as .cancel{font-weight:600}

/* visualizzatore foto */
#viewer{position:absolute;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .close{position:absolute;top:calc(var(--sat) + 10px);right:14px;width:36px;height:36px;border-radius:50%;background:rgba(60,60,67,.8);color:#fff;font-size:18px;display:grid;place-items:center}

#toast{position:absolute;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,20px);z-index:50;color:#fff;background:var(--toast);padding:11px 18px;border-radius:99px;
  font-size:15px;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* selettore a segmenti (tema) */
.seg{display:flex;gap:2px;background:var(--bg3);border-radius:9px;padding:2px;margin:10px 14px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label);transition:background .15s}
.seg button.on{background:var(--segon);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sheet .seg{background:var(--bg4)}
.hero,.hero *{color:#fff}
.plate,.plate *{color:#111}
.plate i{color:#ffd60a}

.hero .sym{flex:none;display:block}
.nav .slot.l .lnk{white-space:nowrap}

a.btn{text-decoration:none}
.sheet .btn.gray{background:var(--bg3);color:var(--blue)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;margin-right:12px;transition:background .15s,border-color .15s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.x2{padding:6px 4px 6px 12px;color:var(--red);font-size:16px}
.sheet .group+.group{margin-top:14px}

.nav .slot.r{gap:18px}
input[type=search]{-webkit-appearance:none}
#q{text-align:left;flex:1;min-width:0;margin-left:10px}
.group+#sres .group-title.first{margin-top:22px}

/* carta veicolo */
.hero{min-height:236px}
.hero .hl{flex:1;min-width:0}
.hero .heroart{position:relative;flex:none;width:118px;margin-top:4px;color:#fff}
.hero .vart{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.hero .heroart .bb{position:absolute;left:-8px;top:-10px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.hero .ring{position:absolute;right:20px;bottom:36px;width:58px;height:58px;z-index:1}
.hero .ring svg{width:100%;height:100%;display:block}
.hero .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .ring .d{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.hero .ring .d.l0{background:#30d158}.hero .ring .d.l1{background:#ffd60a}.hero .ring .d.l2{background:#ff453a}
.hero .ringcap{position:absolute;right:14px;bottom:18px;width:70px;text-align:center;font-size:11px;opacity:.85;z-index:1}
.hero.lt{color:#1c1c1e}
.hero.lt,.hero.lt *{color:#1c1c1e}
.hero.lt .hbtn{background:rgba(0,0,0,.09)}
.hero.lt .heroart{color:#2c2c30}
.hero.lt .heroart .bb{border-color:#fff;color:#fff}
.hero.lt::after{background:rgba(255,255,255,.35)}
.plate,.plate *{color:#111!important}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.dots button{width:8px;height:8px;border-radius:50%;background:var(--sep);padding:0;transition:transform .2s,background .2s}
.dots button.on{background:var(--label);transform:scale(1.25)}
.slide-r{animation:slr .32s ease-out}.slide-l{animation:sll .32s ease-out}
@keyframes slr{from{transform:translateX(34px);opacity:.2}to{transform:none;opacity:1}}
@keyframes sll{from{transform:translateX(-34px);opacity:.2}to{transform:none;opacity:1}}
/* colori */
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:14px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid var(--sep);padding:0;position:relative}
.sw.on{outline:3px solid var(--blue);outline-offset:2px}
.sw.auto{background:linear-gradient(135deg,var(--blue),#5e5ce6);color:#fff;font-weight:700;font-size:14px;border:0}
/* costi */
.donutg{padding:18px 0}
.donut{width:164px;height:164px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.donut .dh{width:108px;height:108px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;text-align:center;gap:2px}
.donut .dh b{font-size:20px;font-variant-numeric:tabular-nums}.donut .dh span{font-size:12px;color:var(--label2)}
.mb{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:130px;padding:12px 14px 10px}

<body>
<div id="splash"><img src="apple-touch-icon.png" alt=""><b>iGarage</b></div>
<div id="app">
  <div id="nav" class="nav"></div>
  <main id="screen"></main>
  <nav id="tabbar"></nav>
  <div id="overlay"></div>
  <div id="as"></div>
  <div id="viewer"></div>
  <div id="toast"></div>
</div>
<script>
/* iGarage – manutenzione auto e scooter. Tutti i dati restano sul dispositivo (IndexedDB). */
(() => {
'use strict';

/* ================= utilità ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nfInt = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' });
const nfEur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', useGrouping: 'always' });
const nfEur0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => toISO(new Date());
const ymd = s => { const [y, m, d] = s.split('-').map(Number); return [y, m - 1, d]; };
const daysBetween = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 864e5);
const addDays = (s, n) => { const [y, m, d] = ymd(s); return toISO(new Date(y, m, d + n)); };
const addMonths = (s, n) => {
  const [y, m, d] = ymd(s);
  const t = new Date(y, m + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, last));
  return toISO(t);
};
const fmtDate = s => { const [y, m, d] = ymd(s); return new Date(y, m, d).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtKm = n => nfInt.format(Math.round(n || 0)) + ' km';
function relDays(n) {
  if (n === 0) return 'oggi';
  const a = Math.abs(n);
  if (a === 1) return n > 0 ? 'domani' : 'ieri';
  const txt = a <= 60 ? `${a} giorni` : a < 730 ? `${Math.round(a / 30.4)} mesi` : `${(a / 365).toFixed(1).replace('.', ',')} anni`;
  return n > 0 ? `tra ${txt}` : `${txt} fa`;
}
function parseNum(s) {
  s = String(s ?? '').replace(/[\s €]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // 84.600 = 84600 (punto delle migliaia)
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
const isStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ================= tipi di intervento ================= */
const TYPES = [
  { k: 'tagliando', n: 'Tagliando', e: '🔧', c: '#0a84ff', km: 15000, mesi: 12 },
  { k: 'olio', n: 'Cambio olio', e: '🛢️', c: '#ff9f0a', km: 15000, mesi: 12 },
  { k: 'gomme', n: 'Gomme', e: '🛞', c: '#8e8e93', mesi: 6 },
  { k: 'freni', n: 'Freni', e: '🛑', c: '#ff453a' },
  { k: 'batteria', n: 'Batteria', e: '🔋', c: '#30d158', mesi: 48 },
  { k: 'distribuzione', n: 'Distribuzione', e: '⚙️', c: '#bf5af2', km: 120000, mesi: 60 },
  { k: 'revisione', n: 'Revisione', e: '📋', c: '#64d2ff', mesi: 24, fixed: true },
  { k: 'bollo', n: 'Bollo', e: '🧾', c: '#ffd60a', mesi: 12, fixed: true },
  { k: 'assicurazione', n: 'Assicurazione', e: '🛡️', c: '#5e5ce6', mesi: 12, fixed: true },
  { k: 'gomme_inv', n: 'Gomme invernali', e: '❄️', c: '#64d2ff', mesi: 12, season: [10, 15] },
  { k: 'gomme_est', n: 'Gomme estive', e: '☀️', c: '#ff9f0a', mesi: 12, season: [3, 15] },
  { k: 'patente', n: 'Rinnovo patente', e: '🪪', c: '#5ac8fa', mesi: 120, fixed: true },
  { k: 'gpl', n: 'Collaudo bombola', e: '🔥', c: '#ff6b35', mesi: 120, fixed: true },
  { k: 'variatore', n: 'Variatore e rulli', e: '⚙️', c: '#af52de', km: 12000 },
  { k: 'carrozzeria', n: 'Carrozzeria', e: '🚘', c: '#ff6482' },
  { k: 'altro', n: 'Altro', e: '🧰', c: '#8e8e93' },
];
const TYPE = Object.fromEntries(TYPES.map(t => [t.k, t]));
const typeOf = k => TYPE[k] || TYPE.altro;
const FUELS = ['Benzina', 'Diesel', 'GPL', 'Metano', 'Ibrida', 'Elettrica'];
const nextSeason = t => { const [m, d] = t.season; const y = new Date().getFullYear(); let s = toISO(new Date(y, m, d)); if (s < today()) s = toISO(new Date(y + 1, m, d)); return s; };
const TYRES = [['seasonal', 'Estive e invernali'], ['allseason', '4 stagioni'], ['summer', 'Solo estive'], ['winter', 'Solo invernali']];
function syncTyres(car) {
  const has = t => db.reminders.some(r => r.carId === car.id && r.type === t);
  if (car.tyres === 'seasonal') {
    for (const k of ['gomme_inv', 'gomme_est']) if (!has(k)) { const t = TYPE[k]; db.reminders.push({ id: uid(), carId: car.id, type: k, title: t.n, everyKm: null, everyMonths: 12, baseDate: null, baseKm: null, dueDate: nextSeason(t) }); }
  } else if (car.tyres) {
    db.reminders = db.reminders.filter(r => !(r.carId === car.id && (r.type === 'gomme_inv' || r.type === 'gomme_est')));
  }
}
function quickFor(car) {
  if (car.kind === 'scooter') return ['tagliando', 'revisione', 'bollo', 'assicurazione', 'gomme', 'variatore', 'patente'];
  const q = ['tagliando', 'revisione', 'bollo', 'assicurazione', ...(car.tyres && car.tyres !== 'seasonal' ? [] : ['gomme_inv', 'gomme_est']), 'distribuzione', 'patente'];
  if (car.fuel === 'GPL' || car.fuel === 'Metano') q.push('gpl');
  return q;
}
const KIND = { auto: { n: 'Auto', pl: 'auto' }, scooter: { n: 'Scooter', pl: 'scooter' } };
const kindOf = c => (c && c.kind === 'scooter' ? 'scooter' : 'auto');
const DOCT = [
  { k: 'libretto', n: 'Libretto di circolazione', e: '📘', c: '#0a84ff' },
  { k: 'assicurazione', n: 'Assicurazione', e: '🛡️', c: '#5e5ce6' },
  { k: 'patente', n: 'Patente', e: '🪪', c: '#5ac8fa' },
  { k: 'bollo', n: 'Ricevuta bollo', e: '🧾', c: '#ffd60a' },
  { k: 'revisione', n: 'Revisione', e: '📋', c: '#64d2ff' },
  { k: 'acquisto', n: 'Acquisto e contratti', e: '🖋️', c: '#30d158' },
  { k: 'altro', n: 'Altro documento', e: '📄', c: '#8e8e93' },
];
const DOC = Object.fromEntries(DOCT.map(t => [t.k, t]));

/* ================= archivio (IndexedDB) ================= */
let dbp = null;
const getIDB = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('garage-auto', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
}));
async function tx(store, mode, fn) {
  const d = await getIDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const phGet = id => tx('photos', 'readonly', s => s.get(id));
const phPut = (id, v) => tx('photos', 'readwrite', s => s.put(v, id));
const phDel = id => tx('photos', 'readwrite', s => s.delete(id)).catch(() => {});
const phKeys = () => tx('photos', 'readonly', s => s.getAllKeys());
const phClear = () => tx('photos', 'readwrite', s => s.clear());

function normDB() { ['docs', 'contacts', 'fines', 'quotes'].forEach(k => { if (!Array.isArray(db[k])) db[k] = []; }); if (!db.checks) db.checks = {}; }
const allPhotoIds = () => new Set([...db.services, ...db.docs, ...db.fines].flatMap(s => s.photoIds || []).concat(db.cars.map(c => c.photoId).filter(Boolean)));
const emptyDB = () => ({ v: 1, cars: [], services: [], reminders: [], docs: [], contacts: [], fines: [], quotes: [], checks: {}, settings: { carId: null, lastBackup: null, hideInstall: false, theme: 'auto', accent: 'blue' } });
let db = emptyDB();
let storageOK = true;
const phCache = new Map();
async function photoURL(id) {
  if (phCache.has(id)) return phCache.get(id);
  try { const v = await phGet(id); if (v) phCache.set(id, v); return v; } catch (e) { return null; }
}
async function save() {
  try { await kvSet('data', db); storageOK = true; }
  catch (e) { storageOK = false; toast('Salvataggio non riuscito'); }
}
async function load() {
  try {
    const d = await kvGet('data');
    if (d && Array.isArray(d.cars)) { db = Object.assign(emptyDB(), d); normDB(); db.settings = Object.assign(emptyDB().settings, d.settings || {}); }
    // pulizia foto non più usate
    const used = allPhotoIds();
    for (const id of await phKeys()) if (!used.has(id)) phDel(id);
  } catch (e) { storageOK = false; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

/* ================= calcoli ================= */
const curCar = () => db.cars.find(c => c.id === db.settings.carId) || db.cars[0] || null;
const carName = c => [c.make, c.model].filter(Boolean).join(' ') || c.plate || 'Auto';
const fmtPlate = p => (/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p) ? `${p.slice(0, 2)} ${p.slice(2, 5)} ${p.slice(5)}` : p);
const sortedLog = c => (c.kmLog || []).slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
function logKm(car, date, km) {
  car.kmLog = (car.kmLog || []).filter(e => e.date !== date);
  car.kmLog.push({ date, km });
  if (!car.kmDate || date >= car.kmDate) { const a = Math.floor((car.km || 0) / 10000), b2 = Math.floor(km / 10000); if (car.km != null && b2 > a && b2 > 0) car.msNew = b2 * 10000; }
  if (!car.kmDate || date >= car.kmDate) { car.km = km; car.kmDate = date; }
}
function kmRate(car) {
  const l = sortedLog(car);
  if (l.length < 2) return null;
  const a = l[0], b = l[l.length - 1];
  const d = daysBetween(a.date, b.date);
  if (d < 30) return null;
  const r = (b.km - a.km) / d;
  return r > 0 && r < 1500 ? r : null;
}
function estKm(car) {
  const r = kmRate(car);
  if (!r || !car.kmDate) return car.km || 0;
  return Math.round((car.km || 0) + Math.max(0, daysBetween(car.kmDate, today())) * r);
}
const SOON_DAYS = 30, SOON_KM = 1000, DEF_RATE = 30;
function remStatus(r, car) {
  const dueDate = r.dueDate || (r.everyMonths && r.baseDate ? addMonths(r.baseDate, r.everyMonths) : null);
  const dueKm = r.everyKm && r.baseKm != null ? r.baseKm + r.everyKm : null;
  if (!dueDate && dueKm == null) return { level: -1, eq: Infinity, badge: 'Da impostare', sub: 'Imposta ultimo intervento o scadenza' };
  const days = dueDate ? daysBetween(today(), dueDate) : null;
  const kmLeft = dueKm != null ? dueKm - estKm(car) : null;
  const rate = kmRate(car) || DEF_RATE;
  let level = 0;
  if ((days != null && days < 0) || (kmLeft != null && kmLeft < 0)) level = 2;
  else if ((days != null && days <= SOON_DAYS) || (kmLeft != null && kmLeft <= SOON_KM)) level = 1;
  const dk = kmLeft != null ? kmLeft / rate : null;
  const eq = Math.min(days ?? Infinity, dk ?? Infinity);
  const parts = [];
  if (days != null) parts.push(days < 0 ? `scaduta ${relDays(days)}` : `scade ${relDays(days)}`);
  if (kmLeft != null) parts.push(kmLeft < 0 ? `superati di ${nfInt.format(-kmLeft)} km` : `mancano ${nfInt.format(kmLeft)} km`);
  let badge;
  if (level === 2) badge = 'Scaduto';
  else if (days != null && (dk == null || days <= dk)) badge = days <= 60 ? `${days} g` : `${Math.round(days / 30.4)} mesi`;
  else badge = `${nfInt.format(kmLeft)} km`;
  return { level, days, kmLeft, dueDate, dueKm, eq, badge, sub: cap(parts.join(' · ')) };
}
const cmpRem = (a, b) => (b.s.level - a.s.level) || (a.s.eq - b.s.eq);
const carRems = car => db.reminders.filter(r => r.carId === car.id).map(r => ({ r, s: remStatus(r, car) })).sort(cmpRem);
function alertCount() {
  let n = 0;
  for (const car of db.cars) for (const x of carRems(car)) if (x.s.level >= 1) n++;
  n += db.fines.filter(f => !f.paid && f.due && daysBetween(today(), f.due) <= 30).length;
  return n;
}
function advanceReminder(r, s, car, force) {
  const km = s.km ?? car.km;
  if (km != null && (r.baseKm == null || !r.baseDate || s.date >= r.baseDate)) r.baseKm = km;
  if (r.dueDate && r.everyMonths) {
    if (force || s.date >= addDays(r.dueDate, -120)) {
      let d = r.dueDate, i = 0;
      do { d = addMonths(d, r.everyMonths); i++; } while (d <= s.date && i < 60);
      r.dueDate = d;
    }
    r.baseDate = s.date;
  } else {
    if (!r.baseDate || s.date >= r.baseDate) r.baseDate = s.date;
    if (r.dueDate && !r.everyMonths) r.dueDate = null;
  }
}
function costStats(car) {
  const sv = db.services.filter(s => s.carId === car.id && s.cost > 0);
  const total = sv.reduce((a, s) => a + s.cost, 0);
  const y = String(new Date().getFullYear());
  const from12 = addMonths(today(), -12);
  const thisYear = sv.filter(s => s.date.startsWith(y)).reduce((a, s) => a + s.cost, 0);
  const last12 = sv.filter(s => s.date >= from12).reduce((a, s) => a + s.cost, 0);
  const byCat = {}, byYear = {};
  sv.forEach(s => { byCat[s.type] = (byCat[s.type] || 0) + s.cost; const yy = s.date.slice(0, 4); byYear[yy] = (byYear[yy] || 0) + s.cost; });
  const kms = [...(car.kmLog || []).map(e => e.km), ...db.services.filter(s => s.carId === car.id && s.km).map(s => s.km)];
  const range = kms.length ? Math.max(...kms) - Math.min(...kms) : 0;
  return { total, thisYear, last12, byCat, byYear, perKm: range >= 100 && total > 0 ? total / range : null, count: sv.length };
}

/* ================= interfaccia: pezzi riutilizzabili ================= */

function monthBarsInner(sv) {
  const now = new Date(), ms = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); ms.push({ k: d.getFullYear() + '-' + pad(d.getMonth() + 1), l: 'GFMAMGLASOND'[d.getMonth()], v: 0 }); }
  sv.forEach(s => { const m = ms.find(x => x.k === s.date.slice(0, 7)); if (m) m.v += s.cost; });
  const max = Math.max(...ms.map(m => m.v));
  if (!max) return '';
  return `<div class="mb">${ms.map(m => `<div class="mcol"><em>${m.v === max ? nfEur0.format(m.v) : ''}</em><i style="height:${m.v ? Math.max(4, Math.round(m.v / max * 100)) : 0}%"></i><span>${m.l}</span></div>`).join('')}</div>`;
}
function monthBars(car) {
  const inner = monthBarsInner(db.services.filter(s => s.carId === car.id && s.cost > 0));
  return inner ? `<div class="group mbars">${inner}</div>` : `<div class="group"><div class="row"><div class="t"><div class="b">Nessuna spesa negli ultimi 12 mesi.</div></div></div></div>`;
}

const doy = () => { const n = new Date(); return Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5); };
function tipOfDay() {
  const m = new Date().getMonth() + 1, car = curCar(), pool = [];
  if (m >= 10 || m <= 3) pool.push({ e: '❄️', t: 'Dal 15 novembre al 15 aprile, sulle strade con il cartello, servono gomme invernali o le catene a bordo.' }, { e: '🌡️', t: 'Sotto i 7 °C le gomme estive perdono aderenza: se non le cambi, guida con più distanza di sicurezza.' }, { e: '🔋', t: 'Il freddo mette alla prova la batteria: se parte con fatica, fai controllare la carica prima di restare a piedi.' });
  if (m >= 3 && m <= 5) pool.push({ e: '🌸', t: 'In primavera controlla il liquido lavavetri e le spazzole dei tergicristalli: dopo l\'inverno sono spesso da cambiare.' });
  if (m >= 6 && m <= 8) pool.push({ e: '🧳', t: 'Prima di un viaggio lungo controlla pressione delle gomme, olio e liquido refrigerante. Trovi la lista nei Controlli.' }, { e: '☀️', t: 'D\'estate controlla il climatizzatore e il livello del liquido di raffreddamento prima delle giornate più calde.' });
  if (car && car.year && new Date().getFullYear() - car.year >= 4) pool.push({ e: '🔋', t: 'La batteria ha più di 4 anni: fai controllare l\'efficienza al prossimo tagliando.' });
  if (car && car.km) { const next = (Math.floor(car.km / 10000) + 1) * 10000; if (next - car.km <= 1500) pool.push({ e: '🎯', t: `Mancano circa ${nfInt.format(next - car.km)} km ai ${nfInt.format(next)} km: un buon momento per un controllo generale.` }); }
  pool.push(
    { e: '🛞', t: 'Controlla la pressione delle gomme una volta al mese, a freddo. Una pressione giusta riduce consumi e usura.' },
    { e: '🛢️', t: 'Il livello dell\'olio si controlla a motore spento e auto in piano. Se scende spesso, fallo vedere in officina.' },
    { e: '⛽', t: 'Non girare spesso in riserva: la pompa del carburante si raffredda con il carburante e si consuma prima.' },

function countUp(el, to) {
  if (!to || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const t0 = performance.now(), D = 650;
  const step = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = nfInt.format(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); else el.textContent = nfInt.format(to); };
  requestAnimationFrame(step);
}
function hydrate(root) {
  root.querySelectorAll('img[data-ph]').forEach(async img => {
    const u = await photoURL(img.dataset.ph);
    if (u) img.src = u;

let toastT;
function toast(msg) {

function drawThumbs() {

  t.innerHTML = F.photos.map(id => `<div class="thumb"><img data-ph="${id}" data-a="viewPhoto" data-id="${id}" alt=""><button class="x" data-a="rmPhoto" data-id="${id}" aria-label="Rimuovi">✕</button></div>`).join('');

async function compress(file, max = 1600, q = 0.8) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function dropPhoto(id) {
  F.photos = F.photos.filter(x => x !== id);
  if (F.added.includes(id)) { F.added = F.added.filter(x => x !== id); phDel(id); phCache.delete(id); }
  else F.removed.push(id);
}
async function onPickPhotos(e) {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length || !F) return;
  try {
    for (const f of files) {
      const url = await compress(f);
      const id = uid();
      await phPut(id, url); phCache.set(id, url);
      if (F.single) [...F.photos].forEach(dropPhoto);
      F.photos.push(id); F.added.push(id);
      drawThumbs();
    }
  } catch (err) { toast('Impossibile leggere la foto'); }
}
const finishPhotos = () => { if (!F) return; F.removed.forEach(id => { phDel(id); phCache.delete(id); }); };
const cancelPhotos = () => { if (!F) return; F.added.forEach(id => { phDel(id); phCache.delete(id); }); };

  return { level, days, badge: days == null ? '' : days < 0 ? 'Scaduta' : days <= 60 ? days + ' g' : Math.round(days / 30.4) + ' mesi' };
}

const nrm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function searchItems() {
  const items = [], cn = id => { const c = db.cars.find(x => x.id === id); return db.cars.length > 1 && c ? carName(c) : ''; };
  db.services.forEach(s => { const t = typeOf(s.type); items.push({ g: 'Interventi', ico: typeIco(t), a: s.title || t.n, b: [fmtDate(s.date), s.shop, s.cost > 0 ? nfEur.format(s.cost) : '', cn(s.carId)].filter(Boolean).join(' · '), act: 'editService', id: s.id, hay: [t.n, s.title, s.shop, s.notes, fmtDate(s.date), s.cost, s.km] });
  });
  db.reminders.forEach(r => { const t = typeOf(r.type); items.push({ g: 'Scadenze', ico: typeIco(t), a: r.title || t.n, b: cn(r.carId) || 'Scadenza', act: 'editReminder', id: r.id, hay: [t.n, r.title] }); });
  db.docs.forEach(d => { const t = DOC[d.type] || DOC.altro; items.push({ g: 'Documenti', ico: typeIco(t), a: d.title || t.n, b: [t.n, cn(d.carId)].filter(Boolean).join(' · '), act: 'editDoc', id: d.id, hay: [t.n, d.title, d.notes] }); });
  db.fines.forEach(f => items.push({ g: 'Multe', ico: typeIco({ c: '#ff453a', e: '🚨' }), a: f.title || 'Multa', b: [f.amount > 0 ? nfEur.format(f.amount) : '', f.paid ? 'Pagata' : 'Da pagare', cn(f.carId)].filter(Boolean).join(' · '), act: 'editFine', id: f.id, hay: ['multa', f.title, f.notes, f.amount] }));
  db.contacts.forEach(c => { const r = ROLE[c.role] || ROLE.altro; items.push({ g: 'Contatti', ico: typeIco({ c: r.c, e: r.e }), a: c.name, b: [r.n, c.phone].filter(Boolean).join(' · '), act: 'editContact', id: c.id, hay: [r.n, c.name, c.phone, c.notes] }); });
  db.quotes.forEach(x => items.push({ g: 'Preventivi', ico: typeIco({ c: '#5e5ce6', e: '🧮' }), a: x.company || 'Preventivo', b: [nfEur0.format(x.price), cn(x.carId)].filter(Boolean).join(' · '), act: 'editQuote', id: x.id, hay: ['assicurazione preventivo', x.company, x.notes, x.price] }));
  db.cars.forEach(c => items.push({ g: 'Veicoli', ico: brandBadge(c, 30), a: carName(c), b: [c.plate ? fmtPlate(c.plate) : '', c.engine].filter(Boolean).join(' · '), act: 'pickCarId', id: c.id, hay: [c.make, c.model, c.plate, c.vin, c.engine, c.year] }));
  items.forEach(i => { i.h = nrm(i.hay.join(' ')); });
  return items;
}
function searchHTML() {
  const q = nrm(S.q || '').trim();
  if (!q) return `<div class="empty"><div class="big">🔎</div><h2>Cerca in iGarage</h2><p>Scrivi una parola: un'officina, «pastiglie», una targa, un numero di telefono, un importo.</p></div>`;
  const toks = q.split(/\s+/);
  const res = searchItems().filter(i => toks.every(t => i.h.includes(t)));
  if (!res.length) return `<div class="empty"><div class="big">🤷</div><h2>Nessun risultato</h2><p>Prova con un'altra parola o con meno lettere.</p></div>`;
  const groups = {}; res.forEach(i => (groups[i.g] = groups[i.g] || []).push(i));
  return Object.entries(groups).map(([g, l], k) => `<div class="group-title ${k === 0 ? 'first' : ''}">${g}</div><div class="group">${l.slice(0, 30).map(i => `<button class="row two icon tap" data-a="${i.act}" data-id="${i.id}">${i.ico}<div class="t"><div class="a">${esc(i.a)}</div><div class="b">${esc(i.b)}</div></div>${CHEV}</button>`).join('')}</div>`).join('');
}

/* calendario (.ics) */
const icsEsc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\;');
const icsFold = l => { const out = []; while (l.length > 60) { out.push(l.slice(0, 60)); l = ' ' + l.slice(60); } out.push(l); return out; };
function icsEvents() {
  const ev = [];
  for (const car of db.cars) {
    for (const r of db.reminders.filter(x => x.carId === car.id)) {
      const s = remStatus(r, car); let date = s.dueDate, est = false;
      if (!date && s.kmLeft != null) { const rate = kmRate(car); if (rate) { date = addDays(today(), Math.max(0, Math.round(s.kmLeft / rate))); est = true; } }
      if (!date) continue;
      ev.push({ uid: 'r-' + r.id, date, title: `${r.title || typeOf(r.type).n} – ${carName(car)}`, desc: est ? 'Data stimata in base ai chilometri percorsi.' : (s.dueKm != null ? `Oppure a ${nfInt.format(s.dueKm)} km.` : '') });
    }
    db.docs.filter(d => d.carId === car.id && d.expires).forEach(d => ev.push({ uid: 'd-' + d.id, date: d.expires, title: `Scade: ${d.title || (DOC[d.type] || DOC.altro).n} – ${carName(car)}`, desc: '' }));
    db.fines.filter(f => f.carId === car.id && !f.paid && f.due).forEach(f => ev.push({ uid: 'f-' + f.id, date: f.due, title: `Pagare multa${f.title ? ': ' + f.title : ''} – ${carName(car)}`, desc: f.amount ? 'Importo ' + nfEur.format(f.amount) : '' }));
  }
  return ev;
}
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const d8 = s => s.replace(/-/g, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//iGarage//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:iGarage'];
  for (const e of icsEvents()) {
    L.push('BEGIN:VEVENT', `UID:${e.uid}@igarage.app`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(e.date)}`, `DTEND;VALUE=DATE:${d8(addDays(e.date, 1))}`, ...icsFold('SUMMARY:' + icsEsc(e.title)));
    if (e.desc) L.push(...icsFold('DESCRIPTION:' + icsEsc(e.desc)));
    L.push('TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:iGarage', 'TRIGGER:-P6DT15H', 'END:VALARM', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:iGarage', 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT');
  }
  const nm = new Date(); const bd = toISO(new Date(nm.getFullYear(), nm.getMonth() + 1, 1));
  L.push('BEGIN:VEVENT', 'UID:backup@igarage.app', `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(bd)}`, `DTEND;VALUE=DATE:${d8(addDays(bd, 1))}`, 'RRULE:FREQ=MONTHLY', 'SUMMARY:Backup di iGarage', ...icsFold('DESCRIPTION:' + icsEsc('Apri iGarage, vai su Altro e tocca Esporta backup.')), 'TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:iGarage', 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
let pendingICS = null;
function exportICS() {
  if (window.GARAGE_PREVIEW) { toast('Il Calendario funziona nell\'app installata'); return; }
  const n = icsEvents().length;
  if (!n) { toast('Nessuna scadenza con una data'); return; }
  const file = new File([buildICS()], 'igarage-scadenze.ics', { type: 'text/calendar' });
  const fallback = () => { pendingICS = file; openSheet({ title: 'Calendario', noSave: true, body: `<div class="group-foot" style="margin:8px 4px 16px">Ho preparato ${n} promemoria. Tocca il pulsante: se si apre un elenco, scegli «Calendario» oppure salva il file e aprilo da File.</div><button class="btn" data-a="shareICS">Aggiungi al Calendario</button>` }); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Scadenze iGarage' }).then(() => toast('Fatto')).catch(e => { if (e && e.name === 'AbortError') return; if (e && e.name === 'NotAllowedError') fallback(); else dlICS(file); });
  } else dlICS(file);
}
function dlICS(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  toast('File creato: aprilo e scegli Aggiungi al Calendario');
}

/* --- parcheggio --- */
const fmtWhen = iso => new Date(iso).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'adesso';
  if (m < 60) return m + ' min fa';
  const h = Math.round(m / 60);
  if (h < 48) return h + (h === 1 ? ' ora fa' : ' ore fa');
  return Math.round(h / 24) + ' giorni fa';
}
function parkSheet() {
  const car = curCar(), p = car.park, k = kindOf(car) === 'scooter' ? 'lo scooter' : 'l\'auto';
  const url = p ? `https://maps.apple.com/?ll=${p.lat},${p.lng}&q=${encodeURIComponent('Parcheggio ' + carName(car))}` : '';
  openSheet({
    title: 'Parcheggio',
    noSave: !p,
    onSave: async () => { car.park.note = val('pnote').trim(); await save(); render(); toast('Nota salvata'); },
    body: p
      ? `<div class="group">
          <div class="row two"><div class="t"><div class="a">Parcheggiato ${esc(ago(p.at))}</div><div class="b">${esc(fmtWhen(p.at))}${p.acc ? ' · precisione ≈ ' + Math.round(p.acc) + ' m' : ''}</div></div></div>
          ${frow('Nota', 'pnote', inp('pnote', p.note, 'Es. piano -2, settore B', 'autocapitalize="sentences"'))}
        </div>
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Portami lì con Mappe</a>
        <button class="btn gray" data-a="parkHere">Aggiorna con la posizione attuale</button>
        <div class="group" style="margin-top:24px"><button class="row tap red" data-a="parkClear">Cancella parcheggio</button></div>`
      : `<div class="empty" style="padding-bottom:6px"><div class="big">🅿️</div><h2>Dove hai lasciato ${k}?</h2><p>Salva la posizione adesso: più tardi potrai tornarci con Mappe. Il telefono ti chiederà il permesso di usare la posizione.</p></div>
        <button class="btn" data-a="parkHere">Salva la posizione qui</button>`,
  });
}
function parkHere() {
  const car = curCar();
  if (!navigator.geolocation) { toast('Posizione non disponibile su questo dispositivo'); return; }
  toast('Cerco la posizione…');
  navigator.geolocation.getCurrentPosition(async pos => {
    car.park = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: pos.coords.accuracy || null, at: new Date().toISOString(), note: (car.park && car.park.note) || '' };
    await save(); render(); parkSheet(); toast('Posizione salvata');
  }, err => {
    if (err && err.code === 1) toast('Permesso negato: abilita la posizione per Safari in Impostazioni');
    else if (err && err.code === 3) toast('Posizione non trovata, riprova all\'aperto');
    else toast('Posizione non disponibile');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

async function buildBackup() {
  const photos = {};
  const ids = allPhotoIds();
  for (const id of ids) { const v = await photoURL(id); if (v) photos[id] = v; }
  const json = JSON.stringify({ app: 'garage-auto', version: 1, exportedAt: new Date().toISOString(), data: db, photos });
  const name = `igarage-backup-${today()}.json`;
  return new File([json], name, { type: 'application/json' });
}
async function deliverBackup(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file], title: 'Backup iGarage' });
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  db.settings.lastBackup = new Date().toISOString();
  await save(); render(); toast('Backup creato');
}
let pendingBackup = null;
async function exportBackup() {
  if (window.GARAGE_PREVIEW) { toast('Il backup funziona nell\'app installata'); return; }
  const file = await buildBackup();
  try { await deliverBackup(file); }
  catch (e) {
    if (e && e.name === 'AbortError') return;
    if (e && e.name === 'NotAllowedError') { // iOS vuole un nuovo tocco per aprire il menu Condividi
      pendingBackup = file;
      openSheet({ title: 'Backup pronto', noSave: true, body: `<div class="group-foot" style="margin:8px 4px 16px">Tocca il pulsante e scegli dove salvare il file, per esempio «Salva su File» o iCloud Drive.</div><button class="btn" data-a="shareBackup">Salva il backup</button>` });
      return;
    }
    toast('Esportazione non riuscita');
  }
}
function importBackup() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = async () => {
    const f = i.files && i.files[0]; if (!f) return;
    let obj;
    try { obj = JSON.parse(await f.text()); } catch (e) { toast('File non valido'); return; }
    if (!obj || obj.app !== 'garage-auto' || !obj.data || !Array.isArray(obj.data.cars)) { toast('Non è un backup di Garage'); return; }
    const nCars = obj.data.cars.length, nSv = (obj.data.services || []).length;
    actionSheet(`Il backup contiene ${nCars} ${nCars === 1 ? 'veicolo' : 'veicoli'} e ${nSv} interventi. I dati attuali verranno sostituiti.`, [{
      label: 'Sostituisci e importa', danger: true,
      fn: async () => {
        try {
          await phClear(); phCache.clear();
          for (const [id, v] of Object.entries(obj.photos || {})) await phPut(id, v);
          db = Object.assign(emptyDB(), obj.data); normDB();
          db.settings = Object.assign(emptyDB().settings, obj.data.settings || {});
          await save(); S.tab = 'auto'; render(false); toast('Backup importato');
        } catch (e) { toast('Importazione non riuscita'); }
      },
    }]);
  };
  i.click();
}

  db.docs = db.docs.filter(s => s.carId !== id);

  db.fines.filter(s => s.carId === id).forEach(s => (s.photoIds || []).forEach(p => { phDel(p); phCache.delete(p); }));
  db.fines = db.fines.filter(s => s.carId !== id);

  db.cars = db.cars.filter(x => x.id !== id);
  if (db.settings.carId === id) db.settings.carId = db.cars[0] ? db.cars[0].id : null;

  asPick(d, el) { const it = asItems[+d.i]; closeAS(); if (it && it.fn) setTimeout(it.fn, 60); },
  asClose() { closeAS(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const f = A[el.dataset.a];
  if (f) f(el.dataset, el);
});
let swipe = null;
document.addEventListener('touchstart', e => { const h = e.target.closest && e.target.closest('.hero'); swipe = h && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - swipe.x, dy = e.changedTouches[0].clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 45 && db.cars.length > 1 && S.tab === 'auto') A.stepCar({ dir: dx < 0 ? 1 : -1 });
}, { passive: true });
$('#screen').addEventListener('scroll', () => $('#nav').classList.toggle('solid', $('#screen').scrollTop > 38), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetCtx) render(); });

/* ================= avvio ================= */
(async () => {
  await load();
  S.intro = true;
  S.tab = db.cars.length ? 'home' : 'auto';
  render(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') reg(); else addEventListener('load', reg);
  }
})();
})();
